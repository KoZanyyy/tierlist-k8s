# Alternative à l'Ingress (k8s/30-ingress.yaml) avec la Gateway API.
# Nécessite un contrôleur Gateway API et sa GatewayClass (voir le README).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tierlist
  namespace: tierlist
spec:
  gatewayClassName: eg   # à adapter selon le cluster : kubectl get gatewayclass
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "tierlist.local"
      allowedRoutes:
        namespaces:
          from: Same   # seules les routes du namespace tierlist peuvent s'y rattacher
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tierlist
  namespace: tierlist
spec:
  parentRefs:
    - name: tierlist
  hostnames:
    - "tierlist.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: app
          port: 80
