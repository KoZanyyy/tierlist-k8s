# NodePort : accès sans Ingress (minikube service app -n tierlist)
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: tierlist
spec:
  type: NodePort
  selector:
    app: tierlist
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: tierlist
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tierlist
  template:
    metadata:
      labels:
        app: tierlist
    spec:
      containers:
        - name: app
          image: tierlist:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongo
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo
                  key: password
            # $(VAR) est remplacé par Kubernetes avec les variables définies au-dessus
            - name: MONGO_URL
              value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongo:27017/?authSource=admin"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Ne reçoit du trafic que si la base répond
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
          # Redémarre le conteneur s'il ne répond plus (indépendant de la base)
          livenessProbe:
            httpGet:
              path: /livez
              port: 3000
            periodSeconds: 10
